###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e ranger
$menu = tofi-drun -c ~/.config/tofi/configA --drun-launch=true
$browser = brave #--enable-features=UseOzonePlatform --ozone-platform=wayland
$notes = kitty -e vim
$editor = flatpak run com.vscodium.codium
$java = ~/opt/idea-IU-261.20869.38/bin/idea
$python = ~/opt/pycharm-261.20869.49/bin/pycharm
$rust = ~/opt/RustRover-261.20869.45/bin/rustrover
$ruby = ~/opt/RubyMine-261.20869.43/bin/rubymine
$colorPicker = hyprpicker
$daw = fm.reaper.Reaper
$music = flatpak run com.spotify.Client

# --enable-features=UseOzonePlatform --ozone-platform=wayland use this flag to launch CEF/Electron apps in wayland
